<!DOCTYPE html><html><head><meta charset="utf-8"><title>SpeakerBoXXX Bowling</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="style.css"></head><body><h1>🎳 SpeakerBoXXX Bowling Analytics</h1><nav><a href="index.html">Home</a> | <a href="weekly.html">Week 1 Results</a> | <a href="players.html">Players</a> | <a href="records.html">Records</a></nav><div class="card"><h2>Season Snapshot</h2><p>2026-2027 Season • Week 1 Loaded</p></div><div class="card"><table id="tbl"></table></div><div class="card"><canvas id="avg"></canvas></div><script>fetch('data.json').then(r=>r.json()).then(d=>{let t='<tr><th>Bowler</th><th>Avg</th><th>HC</th><th>X/Game</th><th>Spares/Game</th></tr>';d.forEach(x=>t+=`<tr><td>${x.name}</td><td>${Number(x.average).toFixed(1)}</td><td>${x.handicap}</td><td>${Number(x.strikes).toFixed(2)}</td><td>${Number(x.spares).toFixed(2)}</td></tr>`);tbl.innerHTML=t;new Chart(document.getElementById('avg'),{type:'bar',data:{labels:d.map(x=>x.name),datasets:[{label:'Average',data:d.map(x=>x.average)}]}});});</script></body></html>
