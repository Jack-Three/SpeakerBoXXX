<!DOCTYPE html><html><head><meta charset="utf-8"><title>SpeakerboXXX Bowling</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="style.css"></head><body><h1>🎳 SpeakerboXXX Bowling Analytics (2025-26)</h1><div class="card"><h2>Team Roster Statistics</h2><table id="tbl"></table></div><div class="card"><canvas id="avgChart"></canvas></div><script>
fetch('data.json').then(r=>r.json()).then(d=>{let t='<tr><th>Bowler</th><th>Games</th><th>Average</th><th>Handicap</th><th>X/Game</th><th>Spares/Game</th></tr>';d.forEach(x=>t+=`<tr><td>${x.name}</td><td>${x.games}</td><td>${Number(x.average).toFixed(1)}</td><td>${x.handicap}</td><td>${Number(x.strikes_per_game).toFixed(2)}</td><td>${Number(x.spares_per_game).toFixed(2)}</td></tr>`);document.getElementById('tbl').innerHTML=t;new Chart(document.getElementById('avgChart'),{type:'bar',data:{labels:d.map(x=>x.name),datasets:[{label:'Average',data:d.map(x=>x.average),backgroundColor:'#1f77b4'}]}});});
</script><p><a href='players.html'>Players</a> | <a href='analytics.html'>Analytics</a></p></body></html>
